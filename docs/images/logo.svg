<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <radialGradient id="cosmos" cx="50%" cy="45%" r="55%">
      <stop offset="0%" style="stop-color:#1a1040"/>
      <stop offset="50%" style="stop-color:#0d0d2b"/>
      <stop offset="100%" style="stop-color:#050510"/>
    </radialGradient>
    <radialGradient id="nebula" cx="40%" cy="35%" r="50%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.12"/>
      <stop offset="60%" style="stop-color:#8b5cf6;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="40%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </radialGradient>
    <radialGradient id="planet1" cx="40%" cy="35%" r="50%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </radialGradient>
    <radialGradient id="planet2" cx="40%" cy="35%" r="50%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </radialGradient>
    <radialGradient id="planet3" cx="40%" cy="35%" r="50%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </radialGradient>
    <radialGradient id="planet4" cx="40%" cy="35%" r="50%">
      <stop offset="0%" style="stop-color:#fb923c"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="600" height="500" rx="20" fill="url(#cosmos)"/>
  <rect width="600" height="500" rx="20" fill="url(#nebula)"/>

  <!-- Distant stars (tiny dots) -->
  <circle cx="45" cy="30" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="120" cy="55" r="0.8" fill="#fff" opacity="0.4"/>
  <circle cx="520" cy="40" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="560" cy="90" r="0.7" fill="#fff" opacity="0.3"/>
  <circle cx="80" cy="120" r="0.9" fill="#fff" opacity="0.5"/>
  <circle cx="490" cy="130" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="35" cy="200" r="0.8" fill="#fff" opacity="0.35"/>
  <circle cx="570" cy="200" r="1.1" fill="#fff" opacity="0.5"/>
  <circle cx="55" cy="300" r="0.7" fill="#fff" opacity="0.3"/>
  <circle cx="540" cy="280" r="0.9" fill="#fff" opacity="0.45"/>
  <circle cx="100" cy="380" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="500" cy="370" r="0.8" fill="#fff" opacity="0.35"/>
  <circle cx="160" cy="75" r="1.3" fill="#e0f2fe" opacity="0.6" filter="url(#starGlow)"/>
  <circle cx="440" cy="65" r="1.1" fill="#fef3c7" opacity="0.5" filter="url(#starGlow)"/>
  <circle cx="530" cy="320" r="1.2" fill="#ede9fe" opacity="0.5" filter="url(#starGlow)"/>
  <circle cx="70" cy="250" r="1.4" fill="#e0f2fe" opacity="0.4" filter="url(#starGlow)"/>

  <!-- Orbital rings (subtle) -->
  <ellipse cx="300" cy="210" rx="180" ry="60" fill="none" stroke="#22c55e" stroke-width="0.5" opacity="0.12" transform="rotate(-15,300,210)"/>
  <ellipse cx="300" cy="210" rx="130" ry="45" fill="none" stroke="#8b5cf6" stroke-width="0.5" opacity="0.15" transform="rotate(20,300,210)"/>
  <ellipse cx="300" cy="210" rx="220" ry="80" fill="none" stroke="#3b82f6" stroke-width="0.4" opacity="0.08" transform="rotate(-5,300,210)"/>

  <!-- Graph edges (constellation lines connecting planets) -->
  <line x1="300" y1="195" x2="160" y2="260" stroke="#22c55e" stroke-width="1.5" opacity="0.35" filter="url(#glow)"/>
  <line x1="300" y1="195" x2="440" y2="250" stroke="#22c55e" stroke-width="1.5" opacity="0.35" filter="url(#glow)"/>
  <line x1="300" y1="220" x2="230" y2="330" stroke="#8b5cf6" stroke-width="1" opacity="0.25"/>
  <line x1="300" y1="220" x2="390" y2="320" stroke="#8b5cf6" stroke-width="1" opacity="0.25"/>
  <line x1="160" y1="270" x2="230" y2="330" stroke="#3b82f6" stroke-width="0.8" opacity="0.2"/>
  <line x1="440" y1="260" x2="390" y2="320" stroke="#3b82f6" stroke-width="0.8" opacity="0.2"/>
  <line x1="230" y1="340" x2="300" y2="370" stroke="#f59e0b" stroke-width="0.8" opacity="0.2"/>
  <line x1="390" y1="330" x2="300" y2="370" stroke="#f59e0b" stroke-width="0.8" opacity="0.2"/>

  <!-- Central star (sun — core node) -->
  <g filter="url(#bigGlow)">
    <circle cx="300" cy="195" r="28" fill="url(#sun)"/>
  </g>
  <circle cx="300" cy="195" r="35" fill="none" stroke="#fbbf24" stroke-width="0.5" opacity="0.3"/>

  <!-- Planet 1 — Blue (left) -->
  <g filter="url(#glow)">
    <circle cx="160" cy="265" r="18" fill="url(#planet1)"/>
  </g>
  <circle cx="155" cy="260" r="3" fill="#93c5fd" opacity="0.6"/>

  <!-- Planet 2 — Blue (right) -->
  <g filter="url(#glow)">
    <circle cx="440" cy="255" r="16" fill="url(#planet1)"/>
  </g>
  <circle cx="436" cy="251" r="2.5" fill="#93c5fd" opacity="0.5"/>

  <!-- Planet 3 — Purple (bottom-left) -->
  <g filter="url(#glow)">
    <circle cx="230" cy="335" r="14" fill="url(#planet2)"/>
  </g>

  <!-- Planet 4 — Purple (bottom-right) -->
  <g filter="url(#glow)">
    <circle cx="390" cy="325" r="13" fill="url(#planet2)"/>
  </g>

  <!-- Planet 5 — Green (bottom center) -->
  <g filter="url(#glow)">
    <circle cx="300" cy="375" r="11" fill="url(#planet3)"/>
  </g>

  <!-- Small moons / satellites -->
  <circle cx="180" cy="248" r="4" fill="url(#planet4)" filter="url(#glow)"/>
  <circle cx="420" cy="275" r="3.5" fill="url(#planet3)" filter="url(#glow)"/>
  <circle cx="340" cy="360" r="3" fill="url(#planet4)" filter="url(#glow)"/>

  <!-- Flow arrow (workflow trajectory) -->
  <path d="M 335,180 C 380,170 430,190 445,240" stroke="#22c55e" stroke-width="2" fill="none" opacity="0.5" filter="url(#glow)" stroke-dasharray="4,3"/>
  <polygon points="447,235 440,248 453,243" fill="#22c55e" opacity="0.5"/>

  <!-- Title -->
  <text x="300" y="445" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" font-size="34" fill="#e2e8f0" letter-spacing="2">mcp-graph</text>
  <text x="300" y="475" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="400" font-size="14" fill="#64748b" letter-spacing="4">EXECUTION GRAPH AUTOPILOT</text>
</svg>
