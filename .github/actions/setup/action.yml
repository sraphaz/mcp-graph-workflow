name: Setup Node + install deps
description: |
  Shared setup for mcp-graph CI jobs. Assumes checkout@v6 has already run
  in the parent workflow (composite actions cannot run checkout themselves).
  Installs Node 22 with npm cache, installs root dependencies via npm ci,
  and optionally restores/installs dashboard dependencies.

inputs:
  ignore-scripts:
    description: |
      When 'true', runs `npm ci --ignore-scripts` so the husky `prepare`
      hook does not execute. Use for jobs that only need to lint, typecheck,
      or run commitlint — no build artifacts required.
    required: false
    default: 'false'
  install-dashboard:
    description: |
      When 'true', also installs src/web/dashboard/ dependencies, with a
      dedicated cache keyed on the dashboard lockfile.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Node.js 22
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies (ignore scripts)
      if: inputs.ignore-scripts == 'true'
      shell: bash
      run: npm ci --ignore-scripts

    - name: Install dependencies
      if: inputs.ignore-scripts != 'true'
      shell: bash
      run: npm ci

    # Dashboard deps are installed by the root `npm ci` above via npm
    # workspaces (root package.json declares `src/web/dashboard` as a
    # workspace). A second `npm ci` inside the dashboard would install a
    # separate physical copy of `react` there, which broke recharts in
    # vitest with a null `useContext`. The `install-dashboard` input is
    # kept for compatibility but is now a no-op.
