name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # release-please-action v4 emits per-path outputs as `<path>--<key>`,
      # but the literal `.` for the root path silently fails to flow through
      # `steps.release.outputs[...]` here (publish was skipped on every prior
      # release run). Derive the root flags from `paths_released` instead.
      root_release_created: ${{ contains(fromJSON(steps.release.outputs.paths_released || '[]'), '.') }}
      root_tag_name: ${{ steps.release.outputs['mcp-graph--tag_name'] || steps.release.outputs['.--tag_name'] }}
      cli_release_created: ${{ steps.release.outputs['tools/cli--release_created'] }}
      cli_tag_name: ${{ steps.release.outputs['tools/cli--tag_name'] }}
      cli_version: ${{ steps.release.outputs['tools/cli--version'] }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PAT }}

      - name: Auto-merge release PR
        if: ${{ steps.release.outputs.releases_created != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          REPO: ${{ github.repository }}
        run: |
          PR=$(gh pr list --repo "$REPO" --label "autorelease: pending" --json number --jq '.[0].number')
          if [ -n "$PR" ]; then
            echo "Enabling auto-merge on PR #$PR"
            gh pr merge "$PR" --repo "$REPO" --auto --squash --delete-branch
          fi

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.root_release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify package (dry run)
        run: npm publish --dry-run --access public

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-cli:
    needs: release-please
    if: ${{ needs.release-please.outputs.cli_release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Install cli workspace dependencies
        run: cd tools/cli && npm ci

      - name: Typecheck cli
        run: cd tools/cli && npm run compile

      - name: Test cli
        run: cd tools/cli && npm test

      - name: Build cli
        run: cd tools/cli && npm run build

      - name: Verify cli package (dry run)
        run: cd tools/cli && npm publish --dry-run --access public

      - name: Publish cli to npm
        run: cd tools/cli && npm publish --access public --provenance --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  smoke-test:
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.root_release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Wait for npm propagation
        run: sleep 30
      - name: Install published package
        run: |
          VERSION=$(echo "${{ needs.release-please.outputs.root_tag_name }}" | sed 's/^mcp-graph-v//')
          npm install -g "@mcp-graph-workflow/mcp-graph@${VERSION}"
      - name: Smoke test CLI
        run: |
          mcp-graph --help
          mcp-graph --version
          echo "✅ Post-release smoke test passed" >> $GITHUB_STEP_SUMMARY
