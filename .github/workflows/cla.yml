name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    if: |
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA') ||
        contains(github.event.comment.body, 'recheck')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/master/CLA.md
          branch: master
          allowlist: dependabot[bot],renovate[bot],DiegoNogueiraDev
          remote-organization-name: DiegoNogueiraDev
          remote-repository-name: mcp-graph-cla-signatures
          custom-notsigned-prcomment: |
            Thank you for your contribution to **mcp-graph** 🎉

            Before we can merge, you need to sign our
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/master/CLA.md).

            **To sign**, comment the exact text:
            > I have read the CLA Document and I hereby sign the CLA

            The CLA grants mcp-graph the right to re-license your contribution under
            AGPL-3.0-or-later or (for organizations that cannot adopt AGPL) under a
            commercial license. Your signature is recorded in a dedicated signatures
            repository and does not transfer copyright.

            If you are contributing on behalf of an employer, please make sure an
            authorized representative also signs — see CLA.md §4.3.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA ✅
          lock-pullrequest-aftermerge: false
