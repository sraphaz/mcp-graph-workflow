name: License — dependency scan

# Always runs on every push/PR so the required `scan` check is always emitted
# back to branch protection. The `changes` job classifies the diff: when no
# dep-related files changed, the `scan` job posts a no-op success notice in
# ~5s; when deps did change, it runs the full license-checker pass.
#
# Pattern mirrors ci.yml's `changes` job — keeping branch protection happy
# without forcing every PR to pay the full ~30s npm install + scan cost.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: license-deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            deps:
              - 'package.json'
              - 'package-lock.json'
              - 'src/web/dashboard/package.json'
              - '.github/workflows/**'

  scan:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        if: needs.changes.outputs.deps == 'true'

      - name: Setup Node.js
        if: needs.changes.outputs.deps == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install production dependencies
        # --ignore-scripts: the only package script we rely on is "prepare"
        # (husky install), which is itself in devDependencies. With --omit=dev
        # husky is absent, so prepare would exit 127. We don't need hooks
        # inside the scan runner anyway.
        if: needs.changes.outputs.deps == 'true'
        run: npm ci --omit=dev --ignore-scripts

      - name: Scan for AGPL-incompatible licenses
        if: needs.changes.outputs.deps == 'true'
        run: |
          set -euo pipefail
          # Reject licenses that are incompatible with redistribution under
          # AGPL-3.0-or-later or that would taint the commercial tier
          # (source-available non-OSI). The allow list is intentionally
          # broad-permissive + AGPL-compatible copyleft, and it includes the
          # handful of disjunctive / compound / legacy-format license strings
          # that legitimate packages in the tree actually publish.
          #
          # Excluded by package name:
          #  - mcp-graph / @mcp-graph-workflow/mcp-graph: our own package.
          #  - intelephense: proprietary PHP language server listed in
          #    optionalDependencies. It is NOT redistributed in our npm
          #    tarball (package.json "files" allowlist ships only dist/ plus
          #    legal docs). Users opt in by keeping optionalDeps enabled; the
          #    intelephense license then governs directly between them and
          #    its author. Treating this as mere aggregation is defensible;
          #    the scan exclusion documents it explicitly.
          #
          # Dashboard deps are covered by this scan because dashboard is a
          # workspace member of the root package; root `npm ci` installs
          # them under the hoisted node_modules tree.
          npx --yes license-checker-rseidelsohn \
            --production \
            --excludePrivatePackages \
            --onlyAllow "MIT;MIT-0;ISC;BSD;BSD*;BSD-2-Clause;BSD-3-Clause;BSD-3-Clause-Clear;Apache-2.0;Apache 2.0;0BSD;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Unlicense;WTFL;Python-2.0;Zlib;BlueOak-1.0.0;(MIT OR Apache-2.0);(MIT OR CC0-1.0);(MIT OR WTFPL);(MIT OR GPL-3.0-or-later);(MIT AND Zlib);(BSD-2-Clause OR MIT OR Apache-2.0);(Apache-2.0 OR MPL-1.1);AGPL-3.0;AGPL-3.0-or-later;LGPL-3.0-or-later;GPL-3.0-or-later" \
            --excludePackages "mcp-graph;@mcp-graph-workflow/mcp-graph;intelephense" \
            --summary

      - name: No-op (deps unchanged)
        if: needs.changes.outputs.deps != 'true'
        run: echo "::notice::No dep-related files changed; license-deps scan trivially passed."
