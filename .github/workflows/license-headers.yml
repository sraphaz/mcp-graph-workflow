name: License headers

on:
  push:
    branches: [master]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - '.license-header.tpl'
      - 'scripts/license/headers.mjs'
      # release-please PRs only modify package.json + CHANGELOG and would
      # otherwise skip this required check, deadlocking auto-merge. Trigger
      # on package.json so the check runs trivially (no SPDX changes) and
      # release PRs can satisfy branch protection.
      - 'package.json'
      - '.release-please-manifest.json'
      # Meta-CI PRs (those that only touch workflow files) also need the
      # check to fire so branch protection does not block them. All workflow
      # changes trigger a trivial run of the SPDX check — stable and fast.
      - '.github/workflows/**'
  pull_request:
    branches: [master]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - '.license-header.tpl'
      - 'scripts/license/headers.mjs'
      # release-please PRs only modify package.json + CHANGELOG and would
      # otherwise skip this required check, deadlocking auto-merge. Trigger
      # on package.json so the check runs trivially (no SPDX changes) and
      # release PRs can satisfy branch protection.
      - 'package.json'
      - '.release-please-manifest.json'
      # Meta-CI PRs (those that only touch workflow files) also need the
      # check to fire so branch protection does not block them. All workflow
      # changes trigger a trivial run of the SPDX check — stable and fast.
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: license-headers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-spdx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check SPDX headers
        run: node scripts/license/headers.mjs --check
